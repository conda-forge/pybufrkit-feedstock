schema_version: 1

context:
  name: pybufrkit
  version: "0.2.25"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pybufrkit-${{ version }}.tar.gz
  sha256: 78894c001d3e171d92f0d0bb827d5fb3d9a1c89c63551d95cd4f7fec2a2162da

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - pybufrkit = pybufrkit:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pytest-runner
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - bitstring >=3.1.3
    - six

tests:
  - python:
      imports:
        - pybufrkit
      pip_check: true
      python_version: ${{ python_min }}
    script:
      - pybufrkit --help

about:
  summary: Python toolkit to work with BUFR files
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/ywangd/pybufrkit

extra:
  recipe-maintainers:
    - akrherz
